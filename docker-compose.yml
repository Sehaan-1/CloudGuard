version: "3.8"

services:
  cloudguard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloudguard-app
    ports:
      - "8050:8050"
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql+asyncpg://cloudguard:${DB_PASSWORD:-cloudguard123}@db:5432/cloudguard
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DEFAULT_PROVIDER=mock
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8050/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: cloudguard-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  db:
    image: postgres:16-alpine
    container_name: cloudguard-db
    environment:
      POSTGRES_DB: cloudguard
      POSTGRES_USER: cloudguard
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cloudguard123}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudguard -d cloudguard"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
